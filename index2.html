<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Assistant</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 400px;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border: none;
      border-radius: 6px;
      background: #007bff;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #meterBox {
      width: 100%;
      height: 10px;
      background: #ddd;
      border-radius: 10px;
      margin-top: 15px;
      overflow: hidden;
    }

    #meter {
      height: 100%;
      width: 0%;
      background: green;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>🎤 Voice Login Assistant</h2>

  <input type="text" id="phone" placeholder="Phone Number">

  <input type="text" id="otp" placeholder="OTP">

  <button onclick="startAssistant()">Start Voice Assistant</button>

  <div id="meterBox">
    <div id="meter"></div>
  </div>

  <div id="status">Say "login" to begin</div>
</div>

<script src="voice2.js"></script>

</body>
</html>

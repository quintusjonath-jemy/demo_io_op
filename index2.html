<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Assistant</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 400px;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border: none;
      border-radius: 6px;
      background: #007bff;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #meterBox {
      width: 100%;
      height: 10px;
      background: #ddd;
      border-radius: 10px;
      margin-top: 15px;
      overflow: hidden;
    }

    #meter {
      height: 100%;
      width: 0%;
      background: green;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="container text-center">
  <h2 class="text-xl font-bold mb-4">🎤 Voice Login Assistant</h2>

  <input type="text" id="phone" placeholder="Phone Number" class="border p-2 m-2 w-64"><br>

  <input type="text" id="otp" placeholder="OTP" class="border p-2 m-2 w-64"><br>

  <button onclick="startAssistant()" class="bg-blue-500 text-white p-3 rounded-full shadow-lg hover:bg-blue-600">
    🎤
  </button>

  <p class="mt-2 text-sm text-gray-600">Tap mic and say "login"</p>

  <div id="meterBox" class="w-64 h-2 bg-gray-300 mx-auto mt-4 rounded">
    <div id="meter" class="h-2 bg-green-500 w-0 rounded"></div>
  </div>

  <div id="status" class="mt-2 text-gray-700">Say "login" to begin</div>
</div>

<script src="voice2.js"></script>

</body>
</html>

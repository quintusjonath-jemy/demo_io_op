<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

body{
    margin:0;
    padding:0;
    background:#dfe1ea;
    font-family:Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:360px;
    padding:20px;
}

.logo-section{
    text-align:center;
}

.logo-box{
    width:60px;
    height:60px;
    background:#062b84;
    border-radius:18px;
    margin:auto;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-size:28px;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.logo-section h1{
    color:#062b84;
    margin-top:15px;
    margin-bottom:5px;
    font-size:40px;
}

.logo-section p{
    color:#555;
    font-size:20px;
}

.login-card{
    background:white;
    padding:20px;
    border-radius:20px;
    margin-top:25px;
    box-shadow:0 4px 10px rgba(0,0,0,0.15);
}

.input-group{
    margin-bottom:20px;
}

.input-group label{
    color:#062b84;
    font-weight:bold;
    margin-left:8px;
}

.input-box{
    border:2px solid #999;
    border-radius:12px;
    padding:12px;
    display:flex;
    align-items:center;
    margin-top:5px;
}

.active{
    border-color:#062b84;
}

.input-box i{
    color:gray;
    font-size:20px;
}

.input-box input{
    border:none;
    outline:none;
    width:100%;
    margin-left:10px;
    font-size:17px;
}

.forgot{
    text-align:right;
    margin-bottom:20px;
}

.forgot a{
    color:#062b84;
    text-decoration:none;
    font-weight:bold;
    font-size:17px;
}

.login-btn{
    width:100%;
    padding:14px;
    background:#062b84;
    color:white;
    border:none;
    border-radius:15px;
    font-size:28px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.login-btn:hover{
    background:#041f63;
}

.voice-section{
    text-align:center;
    margin-top:40px;
}

.voice-btn{
    width:110px;
    height:110px;
    border-radius:50%;
    border:4px solid #062b84;
    background:#f5c62d;
    font-size:45px;
    color:#7a5a00;
    cursor:pointer;
}

.voice-section p{
    margin-top:20px;
    color:#062b84;
    font-size:28px;
    font-weight:bold;
}

.signup{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin-top:20px;
}

.signup span{
    color:#666;
}

.signup button{
    background:#f5c62d;
    border:none;
    padding:8px 14px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

.bottom-cards{
    display:flex;
    gap:15px;
    margin-top:20px;
}

.card{
    flex:1;
    background:white;
    border-radius:18px;
    padding:15px;
    display:flex;
    align-items:center;
    gap:10px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.icon-circle{
    width:45px;
    height:45px;
    background:#f1f1f1;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#062b84;
}

.card h3{
    margin:0;
    color:#444;
    font-size:16px;
}

.card p{
    margin:0;
    color:#666;
    font-size:15px;
}

</style>
</head>
<body>

<div class="container">

    <div class="logo-section">

        <div class="logo-box">
            <i class="fa-solid fa-wheelchair"></i>
        </div>

        <h1>AccessRide</h1>
        <p>Smart Mobility for Everyone</p>

    </div>

    <div class="login-card">

        <div class="input-group">

            <label>Email</label>

            <div class="input-box active">

                <i class="fa-regular fa-envelope"></i>

                <input type="email"
                id="email"
                placeholder="name@example.com">

            </div>

        </div>

        <div class="input-group">

            <label>Password</label>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input type="password"
                id="password"
                placeholder="••••••••">

            </div>

        </div>

        <div class="forgot">
            <a href="#">Forgot Password?</a>
        </div>
        <button class="login-btn" onclick="loginUser()">
            Login →
        </button>

        <div class="voice-section">

            <button class="voice-btn" id="voiceBtn">
                <i class="fa-solid fa-microphone"></i>
            </button>

            <p>Use voice to login</p>

        </div>

        <hr>

        <div class="signup">

            <span>Don’t have an account?</span>

            <button>Sign up</button>

        </div>

    </div>

    <div class="bottom-cards">

        <div class="card">

            <div class="icon-circle">
                <i class="fa-solid fa-shield"></i>
            </div>

            <div>
                <p>Secure</p>
                <p>Login</p>
            </div>

        </div>

        <div class="card">

            <div class="icon-circle">
                <i class="fa-solid fa-headset"></i>
            </div>
            
            <div>
                <p>24/7</p>
                <p>Support</p>
            </div>

        </div>

    </div>

</div>

</body>
</html>
</body>
</html>
